<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>thinking — 設計と検討のノート</title>
<meta name="description" content="AIコーディング、テスト戦略、開発プロセスについての検討メモ集">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕸️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2F0; --card:#F8FAF9; --ink:#16232C; --ink-2:#4A5A63; --rule:#C6D1CC;
  --teal:#1F6F63; --teal-soft:#D5E8E3;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10191F; --card:#18252E; --ink:#E3EAE7; --ink-2:#9FB0AA; --rule:#2C3C45;
    --teal:#5FBFAE; --teal-soft:#16352F;
  }
}
:root[data-theme="dark"]{
  --paper:#10191F; --card:#18252E; --ink:#E3EAE7; --ink-2:#9FB0AA; --rule:#2C3C45;
  --teal:#5FBFAE; --teal-soft:#16352F;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.8}
.wrap{max-width:820px;margin:0 auto;padding:64px 24px 80px}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(2.2rem,6vw,3.2rem);margin:0 0 .2em;line-height:1.2}
.lede{color:var(--ink-2);margin:0 0 48px}
h2{font-family:var(--serif);font-size:1.25rem;margin:40px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
ul.pages{list-style:none;margin:0;padding:0}
ul.pages li{border-bottom:1px solid var(--rule)}
ul.pages a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:18px 4px;color:inherit;text-decoration:none}
ul.pages a:hover .t{color:var(--teal);text-decoration:underline;text-underline-offset:3px}
ul.pages a:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:4px}
.t{font-family:var(--serif);font-weight:800;font-size:1.15rem}
.d{grid-column:1 / -1;color:var(--ink-2);font-size:.93rem}
.date{color:var(--ink-2);font-size:.82rem;white-space:nowrap;align-self:center}
.tags{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:.75rem;background:var(--teal-soft);color:var(--teal);padding:.05em .7em;border-radius:999px}
footer{margin-top:64px;font-size:.82rem;color:var(--ink-2)}
footer a{color:var(--ink-2)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>thinking</h1>
    <p class="lede">AIコーディング、テスト戦略、開発プロセスについて考えたことを、読める形で残していく場所。</p>
  </header>

  <main>
    <section aria-labelledby="sec-testing">
      <h2 id="sec-testing">テスト戦略</h2>
      <ul class="pages">
        <li>
          <a href="testing/ai-coding-test-strategy.html">
            <span class="t">AIが書いたコードを、七枚の網で受け止める</span>
            <span class="date">2026-09-23</span>
            <span class="d">E2E・単体・ミューテーション・契約テストの役割分担と、AIがテストを弱くすることを防ぐガードレール、Screwdriver CIでの流れ。</span>
            <span class="tags"><span>E2E</span><span>ミューテーション</span><span>契約テスト</span><span>Java</span><span>PHP</span></span>
          </a>
        </li>
      </ul>
    </section>
  </main>

  <footer>
    <p>ソース：<a href="https://github.com/sk8metalme/thinking">sk8metalme/thinking</a></p>
  </footer>
</div>
<script>
try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
</body>
</html>
